[pytest]
pythonpath = "."
markers =
    writtenfiles: mark a test as a files writing test.
    long: mark as a test that usually demand more than 10 seconds.
    short: tests that usually demand less than 10 seconds.
    network: mark a test that depends on an external network resource
        (e.g. a live website), so it can be excluded when there is no
        connectivity or the external service is unavailable.